<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraVision</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
    <span class="brand" style="margin-bottom:8px;"><span class="brand-logo" data-brand-logo></span><span class="brand-name">TerraVision</span></span>
    <p style="color:var(--color-ink-muted); font-size:0.9rem; margin-bottom:28px; text-align:center;">
        Satellite land-use classification. Sign in to continue.
    </p>

    <div class="auth-card" style="text-align:center;">
        <div style="display:flex; flex-direction:column; gap:12px;">
            <a href="login.html" class="btn-primary" style="text-decoration:none;">
                <span style="width:18px;height:18px;display:inline-flex;" id="userLoginIcon"></span>
                User Login
            </a>
            <a href="login.html?intent=admin" class="btn-secondary" style="width:100%; text-decoration:none;">
                <span style="width:16px;height:16px;display:inline-flex;" id="adminLoginIcon"></span>
                Admin Login
            </a>
        </div>

        <p class="switch-link">Don't have an account? <a href="register.html">Register</a></p>
    </div>
</div>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script>
    redirectIfAlreadyLoggedIn();
    document.getElementById('userLoginIcon').innerHTML = ICONS.user;
    document.getElementById('adminLoginIcon').innerHTML = ICONS.shield;
</script>
</body>
</html>
