<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - TerraVision</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="topbar"></div>

<div class="page">
    <div class="page-header">
        <h1>Admin dashboard</h1>
        <p>Every registered user and every prediction across all accounts.</p>
    </div>

    <div class="content-card" style="margin-bottom:24px;">
        <h2>Users</h2>
        <div id="usersWrapper"><div class="loading-state">Loading...</div></div>
    </div>

    <div class="content-card">
        <h2>All predictions</h2>

        <div class="filters-bar">
            <div class="filter-field">
                <label for="filterUserId">User ID</label>
                <input type="number" id="filterUserId" placeholder="Any">
            </div>
            <div class="filter-field">
                <label for="filterClass">Class</label>
                <select id="filterClass">
                    <option value="">All</option>
                    <option>AnnualCrop</option>
                    <option>Forest</option>
                    <option>HerbaceousVegetation</option>
                    <option>Highway</option>
                    <option>Industrial</option>
                    <option>Pasture</option>
                    <option>PermanentCrop</option>
                    <option>Residential</option>
                    <option>River</option>
                    <option>SeaLake</option>
                </select>
            </div>
            <div class="filter-field checkbox">
                <input type="checkbox" id="filterLowConfidence">
                <label for="filterLowConfidence">Low confidence only</label>
            </div>
            <button class="btn-secondary" id="applyFiltersBtn">Apply</button>
            <button class="btn-secondary" id="resetFiltersBtn">Reset</button>
        </div>

        <div id="predictionsWrapper"><div class="loading-state">Loading...</div></div>

        <div class="pagination" id="pagination" style="display:none;">
            <button id="prevPageBtn" aria-label="Previous page"><span id="prevIcon"></span></button>
            <span id="pageIndicator">Page 1</span>
            <button id="nextPageBtn" aria-label="Next page"><span id="nextIcon"></span></button>
        </div>
    </div>
</div>

<footer>TerraVision - Spring Boot + DJL + PostgreSQL, serving a ResNet50 model trained on EuroSAT (Sentinel-2)</footer>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
    initProtectedPage('admin', { admin: true });
</script>
<script src="js/admin.js"></script>
</body>
</html>
