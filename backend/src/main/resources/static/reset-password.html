<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - TerraVision</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
    <a href="index.html" class="brand"><span class="brand-logo" data-brand-logo></span><span class="brand-name">TerraVision</span></a>

    <div class="auth-card">
        <div class="auth-icon-row">
            <span class="icon-badge"><span id="headerIcon"></span></span>
        </div>
        <h1>Choose a new password</h1>
        <p class="subtitle">Use at least 8 characters. Resetting signs you out everywhere.</p>

        <div id="errorAlert" class="alert alert-error" style="display:none;"></div>
        <div id="successAlert" class="alert alert-success" style="display:none;"></div>

        <form id="resetForm">
            <div class="form-field">
                <label for="password">New password</label>
                <div class="input-icon-wrapper has-toggle">
                    <span class="input-icon-left" id="lockIcon"></span>
                    <input type="password" id="password" required minlength="8" maxlength="100" autocomplete="new-password">
                    <button type="button" class="input-icon-toggle" id="togglePassword" aria-label="Show password">
                        <span id="togglePasswordIcon"></span>
                    </button>
                </div>
            </div>
            <div class="form-field">
                <label for="confirmPassword">Confirm new password</label>
                <div class="input-icon-wrapper has-toggle">
                    <span class="input-icon-left" id="lockIcon2"></span>
                    <input type="password" id="confirmPassword" required minlength="8" maxlength="100" autocomplete="new-password">
                    <button type="button" class="input-icon-toggle" id="toggleConfirmPassword" aria-label="Show password">
                        <span id="toggleConfirmPasswordIcon"></span>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Reset password</button>
        </form>

        <p class="switch-link"><a href="login.html">Back to log in</a></p>
    </div>
</div>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
    document.getElementById('headerIcon').innerHTML = ICONS.lock;
    document.getElementById('lockIcon').innerHTML = ICONS.lock;
    document.getElementById('lockIcon2').innerHTML = ICONS.lock;

    function wireToggle(inputId, buttonId, iconId) {
        const input = document.getElementById(inputId);
        const button = document.getElementById(buttonId);
        const icon = document.getElementById(iconId);
        icon.innerHTML = ICONS.eye;
        button.addEventListener('click', () => {
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            icon.innerHTML = showing ? ICONS.eye : ICONS.eyeOff;
            button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        });
    }
    wireToggle('password', 'togglePassword', 'togglePasswordIcon');
    wireToggle('confirmPassword', 'toggleConfirmPassword', 'toggleConfirmPasswordIcon');

    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('resetForm');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const submitBtn = document.getElementById('submitBtn');

    function showError(message) {
        errorAlert.innerHTML = `<span style="width:18px;height:18px;display:inline-flex;">${ICONS.xCircle}</span><span>${message}</span>`;
        errorAlert.style.display = 'flex';
    }

    if (!token) {
        form.style.display = 'none';
        showError('This reset link is missing its token. <a href="forgot-password.html">Request a new link</a>.');
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';

        const password = document.getElementById('password').value;
        if (password !== document.getElementById('confirmPassword').value) {
            showError('Passwords do not match.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting...';

        try {
            await apiFetch('/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword: password }),
            });
            clearSession();
            successAlert.innerHTML = `<span style="width:18px;height:18px;display:inline-flex;">${ICONS.checkCircle}</span><span>Password updated. <a href="login.html">Log in</a> with your new password.</span>`;
            successAlert.style.display = 'flex';
            form.style.display = 'none';
        } catch (err) {
            const expired = err.status === 400 && /invalid or has expired/i.test(err.message);
            showError(expired
                ? 'This reset link is invalid or has expired. <a href="forgot-password.html">Request a new one</a>.'
                : err.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset password';
        }
    });
</script>
</body>
</html>
