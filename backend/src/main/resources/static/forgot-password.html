<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - TerraVision</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
    <a href="index.html" class="brand"><span class="brand-logo" data-brand-logo></span><span class="brand-name">TerraVision</span></a>

    <div class="auth-card">
        <div class="auth-icon-row">
            <span class="icon-badge"><span id="headerIcon"></span></span>
        </div>
        <h1>Forgot your password?</h1>
        <p class="subtitle">Enter your account email and we'll send you a link to choose a new one.</p>

        <div id="errorAlert" class="alert alert-error" style="display:none;"></div>
        <div id="successAlert" class="alert alert-success" style="display:none;"></div>

        <form id="forgotForm">
            <div class="form-field">
                <label for="email">Email</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon-left" id="mailIcon"></span>
                    <input type="email" id="email" required autocomplete="email">
                </div>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
        </form>

        <p class="switch-link"><a href="login.html">Back to log in</a></p>
    </div>
</div>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
    document.getElementById('headerIcon').innerHTML = ICONS.mail;
    document.getElementById('mailIcon').innerHTML = ICONS.mail;

    const form = document.getElementById('forgotForm');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        const email = document.getElementById('email').value.trim();
        try {
            await apiFetch('/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email }),
            });
            successAlert.innerHTML = `<span style="width:18px;height:18px;display:inline-flex;">${ICONS.checkCircle}</span><span>If an account exists for that email, a reset link is on its way. It expires in 1 hour. Check your spam folder too.</span>`;
            successAlert.style.display = 'flex';
            form.style.display = 'none';
        } catch (err) {
            errorAlert.innerHTML = `<span style="width:18px;height:18px;display:inline-flex;">${ICONS.xCircle}</span><span>${err.message}</span>`;
            errorAlert.style.display = 'flex';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send reset link';
        }
    });
</script>
</body>
</html>
