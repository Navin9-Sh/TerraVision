server:
  forward-headers-strategy: native
  port: ${PORT:8080}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-n/a}] %logger{36} - %msg%n"

spring:
  application:
    name: terravision-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${BREVO_SMTP_HOST:smtp-relay.brevo.com}
    port: ${BREVO_SMTP_PORT:587}
    username: ${BREVO_SMTP_USERNAME:}
    password: ${BREVO_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

terravision:
  jwt:
    secret: ${TERRAVISION_JWT_SECRET:}
    expiration-minutes: 15
    refresh-expiration-days: 7
  email-validation:
    dns-check: ${EMAIL_DNS_CHECK:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:}
    brevo-api-key: ${BREVO_API_KEY:}
    app-base-url: ${APP_BASE_URL:http://localhost:8080}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  inference:
    model-dir: ./model
    model-name: terravision-resnet50
    confidence-threshold: 0.60
    low-confidence-message: >
      This model was trained exclusively on Sentinel-2 satellite tiles from the EuroSAT dataset.
      Low confidence usually means the uploaded image isn't an overhead satellite tile, or uses
      different sensor/resolution characteristics than the training data. Treat this prediction
      as unreliable.

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/terravision
    username: terravision
    password: terravision

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:terravision}
    username: ${DB_USERNAME:terravision}
    password: ${DB_PASSWORD:terravision}
