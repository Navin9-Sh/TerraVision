name: Publish deployable jar

# Builds the Linux jar (it bundles the Linux PyTorch native library, which a jar built on
# Windows would not) and publishes it as the "deploy-latest" release asset. Hosts that run
# the app from a downloaded jar (see deploy/huggingface/) fetch it from here.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/release-jar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Tests run in ci.yml; this job only has to produce the artifact.
      - name: Build jar
        working-directory: backend
        run: |
          mvn -B -DskipTests package
          cp target/backend-0.1.0.jar terravision.jar
          ls -lh terravision.jar

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-latest
          name: Deployable jar (latest main)
          body: Linux build of the latest `main`, used by deployment targets that download the jar at startup. Not a versioned release.
          prerelease: true
          files: backend/terravision.jar
