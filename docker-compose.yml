services:
  postgres:
    image: postgres:16-alpine
    container_name: terravision-postgres
    environment:
      POSTGRES_DB: terravision
      POSTGRES_USER: terravision
      POSTGRES_PASSWORD: terravision
    ports:
      - "5432:5432"
    volumes:
      - terravision-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terravision -d terravision"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
    container_name: terravision-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: terravision
      DB_USERNAME: terravision
      DB_PASSWORD: terravision
      TERRAVISION_JWT_SECRET: ${TERRAVISION_JWT_SECRET:-local-dev-jwt-secret-please-override-with-32-plus-random-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@terravision.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-immediately}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@terravision.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      BREVO_SMTP_USERNAME: ${BREVO_SMTP_USERNAME:-}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    ports:
      - "8080:8080"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: terravision-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@terravision.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - terravision-pgadmin-data:/var/lib/pgadmin

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: terravision-prometheus
    profiles: ["monitoring"]
    depends_on:
      - app
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: terravision-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  terravision-postgres-data:
  terravision-pgadmin-data:
