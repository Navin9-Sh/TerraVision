services:
  postgres:
    image: postgres:16-alpine
    container_name: terravision-postgres
    environment:
      POSTGRES_DB: terravision
      POSTGRES_USER: terravision
      POSTGRES_PASSWORD: terravision
    ports:
      - "5432:5432"
    volumes:
      - terravision-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terravision -d terravision"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
    container_name: terravision-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: terravision
      DB_USERNAME: terravision
      DB_PASSWORD: terravision
      # Real values come from a local .env file (gitignored, never committed) --
      # see .env.example for the template. The fallbacks after ":-" are safe
      # placeholders so this still runs out-of-the-box for anyone cloning the
      # repo without setting up a .env, per DEPLOYMENT.md.
      TERRAVISION_JWT_SECRET: ${TERRAVISION_JWT_SECRET:-local-dev-jwt-secret-please-override-with-32-plus-random-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@terravision.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-immediately}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@terravision.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      BREVO_SMTP_USERNAME: ${BREVO_SMTP_USERNAME:-}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
    ports:
      - "8080:8080"

  # Local-development-only DB browser. Not part of the deployed system (see
  # DEPLOYMENT.md) -- Render/Railway don't run this service, it's purely a
  # convenience for inspecting the predictions table on your own machine.
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: terravision-pgadmin
    depends_on:
      - postgres
    environment:
      # pgAdmin's own email validator rejects the .local TLD as not a
      # real-looking domain (even with deliverability checking disabled), unlike
      # the app's own @Email validation which accepts it -- hence a different,
      # real-TLD-shaped address here specifically for pgAdmin's login.
      PGADMIN_DEFAULT_EMAIL: admin@terravision.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - terravision-pgadmin-data:/var/lib/pgadmin

volumes:
  terravision-postgres-data:
  terravision-pgadmin-data:
